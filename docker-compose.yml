services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-app
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - book-network

  nginx:
    image: nginx:alpine
    container_name: book-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - book-network

networks:
  book-network:
    driver: bridge